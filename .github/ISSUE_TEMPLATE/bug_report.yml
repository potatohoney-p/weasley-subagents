name: Bug report
description: Report a reproducible Weasley Subagents problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.38.0"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps with secrets removed.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, Pi version, and relevant configuration.
    validations:
      required: true
